{% load wagtailimages_tags %}
<div class="card">
    {% if self.image %}
    {% image self.image fill-390x312 as img %}
<img src="{{ img.url }}" class="card-img-top" alt="{{ img.alt }}">
    {% endif %}
    <div class="card-body">
        <h5 class="card-title">{{ self.title }}</h5>
        <p class="card-text">{{ self.text }}</p>
    </div>
    {% if self.footer %}
        <div class="card-footer text-muted">
            {{ self.footer }}
        </div>
    {% endif %}
</div>
